name: Continuous Integration

# Runs on every Pull Request targeting main, and on pushes to any branch
# except main (main is only ever updated through a merged Pull Request).
on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  run-automated-tests:
    name: Run automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --requirement requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

  validate-docker-build:
    name: Validate Docker image build
    runs-on: ubuntu-latest
    needs: run-automated-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read application version from VERSION file
        id: read_application_version
        run: echo "application_version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (validation only, no push)
        run: |
          docker build \
            --build-arg APPLICATION_VERSION="${{ steps.read_application_version.outputs.application_version }}" \
            --build-arg GIT_COMMIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg SOURCE_REPOSITORY="https://github.com/${{ github.repository }}" \
            --tag student-ml-api:ci-${{ github.sha }} \
            .

      - name: Smoke test the built image
        run: |
          docker run --detach --name student-ml-api-ci --publish 5000:5000 \
            student-ml-api:ci-${{ github.sha }}
          sleep 5
          curl --fail http://localhost:5000/health
          docker stop student-ml-api-ci
