name: Release

# Runs only when a semantic-version tag is pushed, never on a Pull Request.
on:
  push:
    tags:
      - "v*.*.*"

# GITHUB_TOKEN needs write access to GitHub Packages to push to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build-and-publish-image:
    name: Build and publish versioned Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --requirement requirements-dev.txt

      - name: Run pytest before publishing
        run: python -m pytest

      - name: Derive application version from the Git tag
        id: derive_application_version
        run: |
          GIT_TAG_NAME="${GITHUB_REF_NAME}"
          APPLICATION_VERSION="${GIT_TAG_NAME#v}"
          echo "application_version=${APPLICATION_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived ${APPLICATION_VERSION} from tag ${GIT_TAG_NAME}"

      - name: Verify VERSION file matches the Git tag
        run: |
          VERSION_FILE_CONTENT="$(cat VERSION)"
          DERIVED_VERSION="${{ steps.derive_application_version.outputs.application_version }}"
          if [ "${VERSION_FILE_CONTENT}" != "${DERIVED_VERSION}" ]; then
            echo "VERSION file (${VERSION_FILE_CONTENT}) does not match tag (${DERIVED_VERSION})"
            exit 1
          fi

      - name: Convert repository owner to lowercase
        id: convert_repository_owner
        run: |
          OWNER_LOWERCASE="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner_lowercase=${OWNER_LOWERCASE}" >> "$GITHUB_OUTPUT"

      - name: Compute short commit SHA
        id: compute_short_commit_sha
        run: echo "short_commit_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APPLICATION_VERSION=${{ steps.derive_application_version.outputs.application_version }}
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.convert_repository_owner.outputs.owner_lowercase }}/student-ml-api:${{ steps.derive_application_version.outputs.application_version }}
            ghcr.io/${{ steps.convert_repository_owner.outputs.owner_lowercase }}/student-ml-api:latest
            ghcr.io/${{ steps.convert_repository_owner.outputs.owner_lowercase }}/student-ml-api:${{ steps.compute_short_commit_sha.outputs.short_commit_sha }}
